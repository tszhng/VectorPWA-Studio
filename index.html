function objectToSVGString(o) {
  let attrs = `id="${o.id}"`;
  if (o.rotation) attrs += ` transform="rotate(${n(o.rotation)} ${n(o.x + o.w / 2)} ${n(o.y + o.h / 2)})"`;
  if (o.opacity !== undefined && o.opacity !== 1) attrs += ` opacity="${o.opacity}"`;
  const fill = o.fill || "none";
  const stroke = o.stroke || "none";
  const sw = o.strokeWidth || 0;
  const paint = `fill="${fill}" stroke="${stroke}" stroke-width="${n(sw)}" stroke-linejoin="round" stroke-linecap="round"`;
  switch (o.type) {
    case "rect": return `<rect ${attrs} x="${n(o.x)}" y="${n(o.y)}" width="${n(o.w)}" height="${n(o.h)}" ${paint}/>`;
    case "ellipse": return `<ellipse ${attrs} cx="${n(o.x + o.w / 2)}" cy="${n(o.y + o.h / 2)}" rx="${n(o.w / 2)}" ry="${n(o.h / 2)}" ${paint}/>`;
    case "line": return `<line ${attrs} x1="${n(o.x1)}" y1="${n(o.y1)}" x2="${n(o.x2)}" y2="${n(o.y2)}" stroke="${stroke}" stroke-width="${n(sw)}" stroke-linecap="round"/>`;
    case "path": return `<path ${attrs} d="${pathToD(o.points, o.closed)}" ${paint}/>`;
    case "image": return `<image ${attrs} x="${n(o.x)}" y="${n(o.y)}" width="${n(o.w)}" height="${n(o.h)}" href="${o.src}" preserveAspectRatio="none"/>`;
    case "text": return `<text ${attrs} x="${n(o.x)}" y="${n(o.y + o.fontSize * 0.82)}" font-family="${escapeXML(o.fontFamily)}" font-size="${n(o.fontSize)}" fill="${fill}">${escapeXML(o.text)}</text>`;
  }
  return "";
}
function buildSVGString() {
  const ab = getActiveArtboard();
  if (!ab) return "";
  const W = ab.w, H = ab.h;
  let body = "";
  for (const o of state.doc.objects) {
    if (!o.visible) continue;
    const clone = JSON.parse(JSON.stringify(o));
    moveObjectBy(clone, -ab.x, -ab.y);
    body += "\n  " + objectToSVGString(clone);
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">
  <title>${escapeXML(state.doc.name)}</title>
  <desc>Created with VectorPWA Studio</desc>${body}
</svg>
`;
}

/* ══════════════════════════════════════════════════════════
   PDF 匯出（含圖像 XObject）
   ══════════════════════════════════════════════════════════ */
function pdfColor(hex) { return hexToRgb(hex).map(v => v.toFixed(4)).join(" "); }
function pdfPathCmds(o) {
  const L = [];
  if (o.type === "rect") { L.push(`${n(o.x)} ${n(o.y + o.h)} ${n(o.w)} ${n(o.h)} re`); return L.join("\n"); }
  if (o.type === "ellipse") {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, rx = o.w / 2, ry = o.h / 2;
    const k = 0.5522847498307936, kx = rx * k, ky = ry * k;
    L.push(`${n(cx + rx)} ${n(cy)} m`);
    L.push(`${n(cx + rx)} ${n(cy + ky)} ${n(cx + kx)} ${n(cy + ry)} ${n(cx)} ${n(cy + ry)} c`);
    L.push(`${n(cx - kx)} ${n(cy + ry)} ${n(cx - rx)} ${n(cy + ky)} ${n(cx - rx)} ${n(cy)} c`);
    L.push(`${n(cx - rx)} ${n(cy - ky)} ${n(cx - kx)} ${n(cy - ry)} ${n(cx)} ${n(cy - ry)} c`);
    L.push(`${n(cx + kx)} ${n(cy - ry)} ${n(cx + rx)} ${n(cy - ky)} ${n(cx + rx)} ${n(cy)} c`);
    L.push("h");
    return L.join("\n");
  }
  if (o.type === "line") { L.push(`${n(o.x1)} ${n(o.y1)} m`); L.push(`${n(o.x2)} ${n(o.y2)} l`); return L.join("\n"); }
  if (o.type === "path") {
    const pts = o.points;
    if (!pts.length) return "";
    L.push(`${n(pts[0].x)} ${n(pts[0].y)} m`);
    const len = pts.length, end = o.closed ? len : len - 1;
    for (let i = 0; i < end; i++) {
      const a = pts[i], b = pts[(i + 1) % len];
      if (a.hOut || b.hIn) {
        const c1 = a.hOut || a, c2 = b.hIn || b;
        L.push(`${n(c1.x)} ${n(c1.y)} ${n(c2.x)} ${n(c2.y)} ${n(b.x)} ${n(b.y)} c`);
      } else L.push(`${n(b.x)} ${n(b.y)} l`);
    }
    if (o.closed) L.push("h");
    return L.join("\n");
  }
  return "";
}
function pdfEscapeString(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)").replace(/[^\x20-\x7E]/g, "?");
}
function objectToPDF(o, pageHpt) {
  const hasFill = o.fill && o.fill !== "none";
  const hasStroke = o.stroke && o.stroke !== "none" && (o.strokeWidth || 0) > 0;
  if (o.type === "text") {
    if (!o.text) return "";
    const out = [];
    out.push("q");
    const tx = o.x * MM2PT;
    const ty = pageHpt - (o.y + o.fontSize * 0.82) * MM2PT;
    const size = o.fontSize * MM2PT;
    out.push("BT");
    out.push(`/F1 ${size.toFixed(3)} Tf`);
    out.push(`${pdfColor(hasFill ? o.fill : "#000000")} rg`);
    out.push(`${tx.toFixed(3)} ${ty.toFixed(3)} Td`);
    out.push(`(${pdfEscapeString(o.text)}) Tj`);
    out.push("ET");
    out.push("Q");
    return out.join("\n");
  }
  if (!hasFill && !hasStroke) return "";
  const cmds = pdfPathCmds(o);
  if (!cmds) return "";
  const out = [];
  out.push("q");
  out.push(`${MM2PT.toFixed(6)} 0 0 ${(-MM2PT).toFixed(6)} 0 ${pageHpt.toFixed(3)} cm`);
  if (hasFill) out.push(`${pdfColor(o.fill)} rg`);
  if (hasStroke) { out.push(`${pdfColor(o.stroke)} RG`); out.push(`${(o.strokeWidth || 0).toFixed(3)} w`); out.push("1 J"); out.push("1 j"); }
  out.push(cmds);
  out.push(hasFill && hasStroke ? "B" : hasFill ? "f" : "S");
  out.push("Q");
  return out.join("\n");
}

function buildPDFBlob() {
  const ab = getActiveArtboard();
  if (!ab) return null;
  const Wpt = ab.w * MM2PT, Hpt = ab.h * MM2PT;

  const contentParts = [];
  const imageAssets = [];

  for (const o of state.doc.objects) {
    if (!o.visible) continue;
    const clone = JSON.parse(JSON.stringify(o));
    moveObjectBy(clone, -ab.x, -ab.y);

    if (clone.type === 'image') {
      const parsed = parseDataURL(clone.src);
      if (!parsed) continue;
      if (parsed.format !== 'jpeg' && parsed.format !== 'jpg') continue;
      const name = 'Im' + (imageAssets.length + 1);
      imageAssets.push({ name, bytes: parsed.bytes, pxW: clone._pxW || 800, pxH: clone._pxH || 600 });
      const xPts = clone.x * MM2PT;
      const yPts = Hpt - (clone.y + clone.h) * MM2PT;
      const wPts = clone.w * MM2PT;
      const hPts = clone.h * MM2PT;
      contentParts.push('q');
      contentParts.push(`${wPts.toFixed(3)} 0 0 ${hPts.toFixed(3)} ${xPts.toFixed(3)} ${yPts.toFixed(3)} cm`);
      contentParts.push(`/${name} Do`);
      contentParts.push('Q');
      continue;
    }

    const s = objectToPDF(clone, Hpt);
    if (s) contentParts.push(s);
  }

  const contentStream = contentParts.join('\n');

  const objects = [];
  objects.push({ kind: 'str', data: '<< /Type /Catalog /Pages 2 0 R >>' });
  objects.push({ kind: 'str', data: '<< /Type /Pages /Kids [3 0 R] /Count 1 >>' });
  const xobjRefs = imageAssets.map((im, i) => `/${im.name} ${6 + i} 0 R`).join(' ');
  const xobjDict = imageAssets.length > 0 ? `/XObject << ${xobjRefs} >> ` : '';
  objects.push({ kind: 'str', data: `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wpt.toFixed(3)} ${Hpt.toFixed(3)}] /Resources << /Font << /F1 5 0 R >> ${xobjDict}/ProcSet [/PDF /Text /ImageB /ImageC /ImageI] >> /Contents 4 0 R >>` });
  objects.push({ kind: 'stream', dict: `<< /Length ${contentStream.length} >>`, data: contentStream });
  objects.push({ kind: 'str', data: '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>' });
  for (const im of imageAssets) {
    objects.push({
      kind: 'imgstream',
      dict: `<< /Type /XObject /Subtype /Image /Width ${im.pxW} /Height ${im.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`,
      bytes: im.bytes
    });
  }

  const chunks = [];
  let offset = 0;
  const enc = s => {
    const a = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xFF;
    return a;
  };
  const push = x => {
    const arr = typeof x === 'string' ? enc(x) : x;
    chunks.push(arr);
    offset += arr.length;
  };

  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  const offsets = [];
  for (let i = 0; i < objects.length; i++) {
    offsets.push(offset);
    const obj = objects[i];
    const idStr = `${i + 1} 0 obj\n`;
    if (obj.kind === 'str') {
      push(idStr + obj.data + '\nendobj\n');
    } else if (obj.kind === 'stream') {
      push(idStr + obj.dict + '\nstream\n');
      push(obj.data);
      push('\nendstream\nendobj\n');
    } else if (obj.kind === 'imgstream') {
      push(idStr + obj.dict + '\nstream\n');
      push(obj.bytes);
      push('\nendstream\nendobj\n');
    }
  }

  const xrefOffset = offset;
  let xref = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  for (const off of offsets) xref += String(off).padStart(10, '0') + ' 00000 n \n';
  xref += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  push(xref);

  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  return new Blob([out], { type: 'application/pdf' });
}

   PDF 導入

let pdfjsLoading = null;
function loadPdfJS() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsLoading) return pdfjsLoading;
  pdfjsLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.onload = () => {
      if (window.pdfjsLib) {
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        } catch (e) {}
        resolve(window.pdfjsLib);
      } else reject(new Error('pdf.js 載入失敗'));
    };
    script.onerror = () => reject(new Error('無法載入 pdf.js，請檢查網路連線'));
    document.head.appendChild(script);
  });
  return pdfjsLoading;
}

let isImporting = false;
const importOverlay = $("#importOverlay");
const importSub = $("#importSub");
const importBar = $("#importBar");
const importStatus = $("#importStatus");

async function importPDFFile(file) {
  if (isImporting) { toast('請等待目前導入完成'); return; }
  isImporting = true;
  importOverlay.classList.add("open");
  importSub.textContent = "正在載入 PDF 解析庫...";
  importBar.style.width = "0%";
  importStatus.textContent = "";

  let imported = 0, total = 0;
  try {
    let pdfjsLib;
    try {
      pdfjsLib = await loadPdfJS();
    } catch (err) {
      importSub.textContent = err.message;
      toast(err.message);
      return;
    }

    let pdf;
    try {
      importSub.textContent = "正在解析 PDF 檔案...";
      const ab = await file.arrayBuffer();
      pdf = await pdfjsLib.getDocument({ data: ab }).promise;
      total = pdf.numPages;
    } catch (err) {
      importSub.textContent = "PDF 解析失敗：" + (err.message || err);
      toast("PDF 解析失敗：" + (err.message || err));
      return;
    }

    importSub.textContent = `PDF 共 ${total} 頁，開始渲染...`;
    const DPI = 200;

    for (let i = 1; i <= total; i++) {
      importStatus.textContent = `${i} / ${total}`;
      importBar.style.width = ((i - 1) / total * 100) + "%";
      await new Promise(r => setTimeout(r, 20));

      try {
        const page = await pdf.getPage(i);
        const vp1 = page.getViewport({ scale: 1 });
        const wMM = vp1.width * 25.4 / 72;
        const hMM = vp1.height * 25.4 / 72;

        let rs = DPI / 72;
        const pxCount = vp1.width * vp1.height * rs * rs;
        if (pxCount > 16000000) rs = Math.sqrt(16000000 / (vp1.width * vp1.height));

        const vp = page.getViewport({ scale: rs });
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(vp.width);
        cv.height = Math.ceil(vp.height);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cv.width, cv.height);

        await page.render({ canvasContext: ctx, viewport: vp }).promise;

        const jpeg = cv.toDataURL('image/jpeg', 0.88);

        // 建立獨立工作區域
        const prevAb = state.doc.artboards[state.doc.artboards.length - 1];
        const abX = prevAb ? prevAb.x + prevAb.w + 20 : 0;
        const ab = makeArtboard(`PDF 第 ${i} 頁`, abX, 0, wMM, hMM);
        state.doc.artboards.push(ab);
        state.doc.activeArtboard = ab.id;

        // 放置圖像物件覆蓋整個工作區域
        const obj = baseObj('image', `PDF 第 ${i} 頁`);
        Object.assign(obj, {
          x: ab.x, y: ab.y, w: wMM, h: hMM,
          src: jpeg, _pxW: cv.width, _pxH: cv.height,
          fill: 'none', stroke: 'none', strokeWidth: 0
        });
        state.doc.objects.push(obj);
        imageCache.set(obj.id, { src: jpeg, pxW: cv.width, pxH: cv.height });
        imported++;
      } catch (err) {
        console.error('頁面 ' + i + ' 渲染失敗', err);
      }
    }

    importBar.style.width = "100%";
    importStatus.textContent = `完成 ${imported} / ${total}`;
    importSub.textContent = "導入完成！可直接在上方繪製或修改。";

    if (imported > 0) {
      pushHistory();
      fitToScreen();
      toast(`PDF 導入完成：${imported} 頁`);
    } else {
      toast("PDF 導入失敗，請檢查檔案是否有效");
    }

    await new Promise(r => setTimeout(r, 600));
  } finally {
    isImporting = false;
    importOverlay.classList.remove("open");
  }
}

$("#pdfFileInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  await importPDFFile(f);
});

/* ══════════════════════════════════════════════════════════
   下載
   ══════════════════════════════════════════════════════════ */
function download(blobOrString, filename, mime) {
  const blob = blobOrString instanceof Blob ? blobOrString : new Blob([blobOrString], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function safeName() { return (state.doc.name || "vectorpwa").replace(/[\\/:*?"<>|]/g, "_"); }

$$("[data-act]").forEach(btn => {
  btn.addEventListener("click", () => {
    const act = btn.dataset.act;
    if (act === "new") {
      if (state.doc.objects.length && !confirm("建立新檔案？目前內容將被清除。")) return;
      state.doc.objects = [];
      state.selection.clear();
      state.doc.guides = { horizontal: [], vertical: [] };
      state.doc.artboards = [makeArtboard("工作區域 1", 0, 0, 210, 297)];
      state.doc.activeArtboard = state.doc.artboards[0].id;
      pen = null; drag = null;
      state.direct = { objectId: null, anchorIndex: -1, handleType: null };
      history.stack = []; history.index = -1;
      pushHistory();
      fitToScreen();
      toast("已建立新畫板");
      return;
    }
    if (act === "import-pdf") {
      $("#pdfFileInput").click();
      return;
    }
    if (act === "svg") {
      download(buildSVGString(), safeName() + ".svg", "image/svg+xml;charset=utf-8");
      toast("SVG 已匯出（含圖像）");
      return;
    }
    if (act === "pdf") {
      const hasCJK = state.doc.objects.some(o => o.type === "text" && /[^\x00-\x7F]/.test(o.text || ""));
      if (hasCJK && !confirm("PDF 匯出使用標準 Helvetica 字型，中文字元將以 ? 呈現。\n若需完整中文，請改用「匯出 SVG」。\n\n仍要繼續嗎？")) return;
      const blob = buildPDFBlob();
      if (blob) {
        download(blob, safeName() + ".pdf", "application/pdf");
        toast("PDF 已匯出（含圖像）");
      }
      return;
    }
  });
});

/* ══════════════════════════════════════════════════════════
   面板收合
   ══════════════════════════════════════════════════════════ */
$$(".section").forEach(sec => {
  const head = sec.querySelector(".section-head");
  if (head) head.addEventListener("click", () => sec.classList.toggle("collapsed"));
});

/* ══════════════════════════════════════════════════════════
   初始化
   ══════════════════════════════════════════════════════════ */
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 80);
});

function init() {
  state.doc.artboards = [makeArtboard("工作區域 1", 0, 0, 210, 297)];
  state.doc.activeArtboard = state.doc.artboards[0].id;
  updateSwatchUI();
  setTool("select");
  pushHistory();
  fitToScreen();
  setTimeout(() => {
    if (state.doc.objects.length === 0) toast("提示：可點「＋ 導入 PDF」上傳 PDF 檔案；按 R 畫矩形、P 用鋼筆、A 編輯錨點");
  }, 800);
}

init();

})();
